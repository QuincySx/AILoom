# Release pipeline, started by hand (workflow_dispatch):
# - builds ailoom for five targets; each artifact is ailoom-<triple> plus ailoom-<triple>.sha256;
# - by default publishes the npm package ailoom-cli, which carries all five binaries
#   (packaging/npm/build.mjs), via npm Trusted Publishing (OIDC, no token).
#   A version already on npm is skipped, so a rerun is safe.
# Uncheck "publish" to only build.

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (uncheck to only build)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross linker
        if: matrix.cross-linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross-linker }}
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/ailoom"
          cp "$bin" "ailoom-${{ matrix.triple }}"
          chmod +x "ailoom-${{ matrix.triple }}"
          shasum -a 256 "ailoom-${{ matrix.triple }}" > "ailoom-${{ matrix.triple }}.sha256"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ailoom.exe"
          cp "$bin" "ailoom-${{ matrix.triple }}.exe"
          sha256sum "ailoom-${{ matrix.triple }}.exe" > "ailoom-${{ matrix.triple }}.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ailoom-${{ matrix.triple }}
          path: |
            ailoom-${{ matrix.triple }}*
          if-no-files-found: error
          retention-days: 3

  npm:
    name: publish npm
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish == true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Verify sha256 sidecars
        working-directory: dist
        run: |
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest
      - name: Assemble package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node packaging/npm/build.mjs dist "$version" "$RUNNER_TEMP/npm"
      - name: Publish
        run: |
          if npm view "ailoom-cli@$VERSION" version >/dev/null 2>&1; then
            echo "ailoom-cli@$VERSION is already on npm, skipping"
          else
            npm publish "$RUNNER_TEMP/npm" --ignore-scripts --access public
          fi
