# Release pipeline, started by hand (workflow_dispatch):
# - builds ailoom for five targets; each artifact is ailoom-<triple> plus
#   ailoom-<triple>.sha256 ("<hex>  <file>"), the layout scripts/install.sh and
#   packaging/npm/cli.js download from;
# - by default creates the GitHub Release v<Cargo.toml version> and then publishes
#   packaging/npm as ailoom-cli via npm Trusted Publishing (OIDC, no token).
#   npm rejects a version that already exists, so a rerun cannot publish twice.
# Uncheck "publish" to only build.

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub Release and publish to npm (uncheck to only build)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross linker
        if: matrix.cross-linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross-linker }}
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/ailoom"
          cp "$bin" "ailoom-${{ matrix.triple }}"
          chmod +x "ailoom-${{ matrix.triple }}"
          shasum -a 256 "ailoom-${{ matrix.triple }}" > "ailoom-${{ matrix.triple }}.sha256"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ailoom.exe"
          cp "$bin" "ailoom-${{ matrix.triple }}.exe"
          sha256sum "ailoom-${{ matrix.triple }}.exe" > "ailoom-${{ matrix.triple }}.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ailoom-${{ matrix.triple }}
          path: |
            ailoom-${{ matrix.triple }}*
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish == true }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Tag follows Cargo.toml; release notes are that version's CHANGELOG.md section, required
      - name: Version and release notes
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          LC_ALL=C awk -v v="$version" 'index($0, "## " v) == 1 && (length($0) == length("## " v) || substr($0, length("## " v) + 1, 1) !~ /[0-9.]/) {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version; add one before releasing" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Verify sha256 sidecars
        shell: bash
        run: |
          cd dist
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: dist/*

  npm:
    # The npm wrapper downloads this version's Release binary on first run, so it goes after the Release
    name: publish npm
    runs-on: ubuntu-latest
    needs: release
    if: ${{ inputs.publish == true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing needs npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest
      - name: Prepare package
        working-directory: packaging/npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cp ../../LICENSE .
          npm pack --ignore-scripts --dry-run
      - name: Publish
        working-directory: packaging/npm
        run: npm publish --ignore-scripts --access public
