# AIL-029 发布链路（本地准备版）：
# - 手动触发（workflow_dispatch），默认只构建产物并上传 workflow artifacts，不做任何发布；
# - publish=true 时才创建 GitHub Release（tag v<Cargo.toml 版本>）；
# - npm=true（同时需要 publish=true）时再把 packaging/npm 发布为 npm 包 ailoom-cli，
#   用 npm Trusted Publishing（OIDC，无需令牌），需先在 npmjs.com 为该包配置本仓库与 release.yml；
# - 产物命名与 packaging/npm/cli.js、scripts/install.sh 的期望对齐：
#     ailoom-<triple> 与 ailoom-<triple>.sha256（内容格式 "<hex>  <file>"）。

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '同时创建 GitHub Release'
        type: boolean
        default: false
      npm:
        description: '再发布到 npm（需同时勾选上一项）'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross linker
        if: matrix.cross-linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross-linker }}
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/ailoom"
          cp "$bin" "ailoom-${{ matrix.triple }}"
          chmod +x "ailoom-${{ matrix.triple }}"
          shasum -a 256 "ailoom-${{ matrix.triple }}" > "ailoom-${{ matrix.triple }}.sha256"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ailoom.exe"
          cp "$bin" "ailoom-${{ matrix.triple }}.exe"
          sha256sum "ailoom-${{ matrix.triple }}.exe" > "ailoom-${{ matrix.triple }}.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ailoom-${{ matrix.triple }}
          path: |
            ailoom-${{ matrix.triple }}*
          if-no-files-found: error

  release:
    # 仅当显式勾选 publish=true 才创建 GitHub Release；产物即 install.sh /
    # packaging/npm/cli.js 的 AILOOM_DOWNLOAD_BASE 期望布局（裸 binary + .sha256 资产）。
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish == true }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # tag 与 Cargo.toml 版本一致；Release 说明取 CHANGELOG.md 中该版本的段落，没有就不发布
      - name: Version and release notes
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          LC_ALL=C awk -v v="$version" 'index($0, "## " v) == 1 && (length($0) == length("## " v) || substr($0, length("## " v) + 1, 1) !~ /[0-9.]/) {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md 中没有 $version 的段落，先补更新记录再发布" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Verify sha256 sidecars
        shell: bash
        run: |
          cd dist
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: dist/*

  npm:
    # npm 包装器首次运行时下载同版本的 Release 二进制，所以排在 Release 之后
    name: publish npm
    runs-on: ubuntu-latest
    needs: release
    if: ${{ inputs.publish == true && inputs.npm == true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing 需要 npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest
      - name: Prepare package
        working-directory: packaging/npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cp ../../LICENSE .
          npm pack --ignore-scripts --dry-run
      - name: Publish
        working-directory: packaging/npm
        run: npm publish --ignore-scripts --access public
