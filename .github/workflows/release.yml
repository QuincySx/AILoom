# Release pipeline, started by a version tag or by hand (workflow_dispatch):
# - builds ailoom for five targets; each artifact is ailoom-<triple> plus ailoom-<triple>.sha256;
# - by default publishes the npm package ailoom-cli, which carries all five binaries
#   (packaging/npm/build.mjs), via npm Trusted Publishing (OIDC, no token).
#   A version already on npm is skipped, so a rerun is safe.
#   Prerelease versions use npm's next tag; other versions use latest.
# Uncheck "publish" to only build.

name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (uncheck to only build)'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
          - triple: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
          - triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross-linker: aarch64-linux-gnu-gcc
          - triple: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release version and notes
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Version tag does not match Cargo.toml" >&2
            exit 1
          fi
          LC_ALL=C grep -Fq "## ${version}（" CHANGELOG.md || { echo "Missing release notes for $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross linker
        if: matrix.cross-linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross-linker }}
      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: |
          bin="target/${{ matrix.target }}/release/ailoom"
          cp "$bin" "ailoom-${{ matrix.triple }}"
          chmod +x "ailoom-${{ matrix.triple }}"
          shasum -a 256 "ailoom-${{ matrix.triple }}" > "ailoom-${{ matrix.triple }}.sha256"
      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ailoom.exe"
          cp "$bin" "ailoom-${{ matrix.triple }}.exe"
          sha256sum "ailoom-${{ matrix.triple }}.exe" > "ailoom-${{ matrix.triple }}.exe.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ailoom-${{ matrix.triple }}
          path: |
            ailoom-${{ matrix.triple }}*
          if-no-files-found: error
          retention-days: 3

  npm:
    name: publish npm
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist
      - name: Verify sha256 sidecars
        working-directory: dist
        run: |
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Node 24 ships npm 11; fail explicitly if its bundled npm is too old for OIDC.
      - name: Check npm Trusted Publishing support
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (!(major > 11 || major === 11 && (minor > 5 || minor === 5 && patch >= 1))) throw new Error(`npm ${version} is too old for Trusted Publishing`); console.log(`Using bundled npm ${version}`);'
      - name: Assemble package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node packaging/npm/build.mjs dist "$version" "$RUNNER_TEMP/npm"
      - name: Publish
        run: |
          if npm view "ailoom-cli@$VERSION" version >/dev/null 2>&1; then
            echo "ailoom-cli@$VERSION is already on npm, skipping"
          else
            case "$VERSION" in
              *-*) channel=next ;;
              *) channel=latest ;;
            esac
            npm publish "$RUNNER_TEMP/npm" --ignore-scripts --access public --provenance --tag "$channel"
          fi
