name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # AIL-002 隔离规则：清空全部机器根覆盖变量（空值=未设置），
  # 测试内部由 tests/common::isolated_child_env 把子进程根目录注入临时目录
  XDG_DATA_HOME: ""
  XDG_STATE_HOME: ""
  AILOOM_DATA_ROOT: ""
  AILOOM_STORE_ROOT: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # CI 不接触开发者主目录：HOME 指向临时目录，测试本身使用注入数据根
      - name: Isolate HOME
        run: |
          mkdir -p "$RUNNER_TEMP/fake-home"
          echo "HOME=$RUNNER_TEMP/fake-home" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-features

  # AIL-130：声明的最低 Rust 版本（Cargo.toml rust-version）必须真实可编译
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Check on MSRV
        run: cargo check --locked --all-targets

  # AIL-130：前端组件测试与文档门禁（断链、卡片状态一致性、看板生成区）
  frontend-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend components
        run: node --experimental-vm-modules --test tests/frontend_components.mjs tests/global_skills_frontend.mjs
      - name: Docs check
        run: python3 scripts/docs_check.py
