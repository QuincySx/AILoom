name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # AIL-002 隔离规则：清空全部机器根覆盖变量（空值=未设置），
  # 测试内部由 tests/common::isolated_child_env 把子进程根目录注入临时目录
  XDG_DATA_HOME: ""
  XDG_STATE_HOME: ""
  AILOOM_DATA_ROOT: ""
  AILOOM_STORE_ROOT: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # CI 不接触开发者主目录：HOME 指向临时目录，测试本身使用注入数据根
      - name: Isolate HOME
        run: |
          mkdir -p "$RUNNER_TEMP/fake-home"
          echo "HOME=$RUNNER_TEMP/fake-home" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-features
